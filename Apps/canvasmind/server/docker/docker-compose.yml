version: "3.9"

services:
  mcp:
    build:
      context: ../mcp
      # dockerfile: Dockerfile   # <- uncomment if your MCP Dockerfile isn't named "Dockerfile"
    container_name: mcp
    environment:
      MCP_ENV: "dev"
      # APP_HOST: "0.0.0.0"      # <- add if your MCP server expects it
      # APP_PORT: "8080"
    ports:
      - "8081:8080"              # Host:Container (expose MCP locally on 8081)
    networks:
      - cmnet
    restart: unless-stopped
    healthcheck:
      # Adjust path/port if your MCP exposes a different health endpoint
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  gateway:
    build:
      context: ../..
      dockerfile: server/docker/Dockerfile.gateway
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      # Internal URL to call MCP (service name resolves via Docker DNS)
      MCP_BASE_URL: "http://mcp:8080"
    depends_on:
      mcp:
        condition: service_healthy
    networks:
      - cmnet
    restart: unless-stopped

networks:
  cmnet:
    driver: bridge

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAWN • ROSE Three.js World</title>
    <style>
      :root {
        --bg: #0b0d10;
        --fg: #e7eef7;
        --muted: #97a3b6;
        --panel: rgba(12,14,18,.85);
        --accent: #7aa2ff;
        --border: #2a2f3a;
      }
      html, body, #root { height: 100%; margin: 0; background: var(--bg); color: var(--fg); }
      .overlay { position: fixed; top: 0; left: 0; right: 0; padding: 6px 10px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; pointer-events: none; }
      .console { position: fixed; left: 12px; bottom: 12px; width: min(640px, calc(100% - 24px)); pointer-events: auto; }
      .console input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--fg); outline: none; }
      .console .help { margin-top: 6px; opacity: .7; }
      .hud { position: fixed; top: 8px; left: 8px; pointer-events: auto; }
      .panel { backdrop-filter: blur(6px); background: var(--panel); border:1px solid var(--border); border-radius: 12px; padding: 8px 10px; }
      .tabs { display: flex; gap: 6px; margin-bottom: 6px; }
      .tab { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: #0e1218; cursor: pointer; }
      .tab.active { background: #101520; border-color: #3a4456; color: var(--accent); }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .label { opacity: .75; }
      .btn { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: #0d1016; color: var(--fg); cursor: pointer; }
      .btn:hover { background:#121722; }
      .input { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: #0e1116; color: var(--fg); }
      .ghost-note { position: fixed; bottom: 8px; right: 8px; opacity: .7; font: 12px/1.4 ui-monospace, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
